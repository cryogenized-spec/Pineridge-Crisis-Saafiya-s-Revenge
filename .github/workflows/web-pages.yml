name: Godot Web preview
on:
  push:
    branches: [main, godot/native-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved sprite artwork
        run: python3 tools/verify_assets.py
      - name: Verify alternate collapse atlases
        run: python3 tools/verify_backfall.py
      - name: Verify supplied game audio
        run: python3 tools/verify_audio.py
      - name: Install Godot 4.4.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$dest"
          unzip -j /tmp/templates.tpz 'templates/web*.zip' -d "$dest"
          test -s "$dest/web_nothreads_release.zip"
      - name: Import and validate
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee web-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' web-import.log; then exit 1; fi
      - name: Export browser preview
        run: |
          set -euo pipefail
          mkdir -p build/web
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html 2>&1 | tee web-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to export|Export failed' web-export.log; then exit 1; fi
          for name in index.html index.js index.wasm index.pck; do test -s "build/web/$name"; done
          touch build/web/.nojekyll
      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: pineridge-web-preview
          path: build/web/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-logs
          path: web-*.log

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
