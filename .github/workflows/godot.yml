name: Godot validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved sprite artwork
        run: python3 tools/verify_assets.py
      - name: Verify alternate collapse atlases
        run: python3 tools/verify_backfall.py
      - name: Verify supplied game audio
        run: python3 tools/verify_audio.py
      - name: Install pinned Godot
        run: |
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip -d engine
          chmod +x engine/Godot_v4.4.1-stable_linux.x86_64
      - name: Render and verify lateral collapse animation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6 xvfb
          python3 -m pip install -q --disable-pip-version-check vtk numpy Pillow
          xvfb-run -a -s '-screen 0 1024x768x24' python3 tools/render_crowd_side.py
          python3 tools/verify_sidefall.py
          python3 tools/verify_refinement.py
          python3 tools/sprite_kit/verify.py
      - name: Import and check scripts
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error importing|Ogg Vorbis decoding failed|Error loading resource' import.log; then exit 1; fi
      - name: Run scene
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 90 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error importing|Ogg Vorbis decoding failed|Error loading resource' smoke.log; then exit 1; fi
      - name: Exercise crowd review scene
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . res://scenes/character_review.tscn --fixed-fps 60 --quit-after 300 -- --review-smoke 2>&1 | tee review.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error importing|Ogg Vorbis decoding failed|Error loading resource|Assertion failed' review.log; then exit 1; fi
          grep -F 'Crowd review: all presets initialized' review.log
      - name: Exercise barricaded-house story chapter
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . res://scenes/house_one.tscn --fixed-fps 60 --quit-after 300 -- --house-one-smoke 2>&1 | tee house_one.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' house_one.log; then exit 1; fi
          grep -F 'House One smoke: residential exterior' house_one.log
      - name: Exercise Upper Ridge first chapter
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . res://scenes/upper_ridge.tscn --fixed-fps 60 --quit-after 300 -- --upper-ridge-smoke 2>&1 | tee upper_ridge.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' upper_ridge.log; then exit 1; fi
          grep -F 'Upper Ridge smoke: residential map' upper_ridge.log
      - name: Exercise arcade encounters
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . res://scenes/main.tscn --fixed-fps 60 --quit-after 300 -- --encounter-smoke 2>&1 | tee encounter.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error importing|Ogg Vorbis decoding failed|Error loading resource|Assertion failed' encounter.log; then exit 1; fi
          grep -F 'Encounter smoke: actors, arcade damage' encounter.log
      - name: Exercise HUD and character reactions
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script tools/refinement_smoke.gd --quit-after 300 2>&1 | tee refinement.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' refinement.log; then exit 1; fi
          grep -F 'Graphics refinement smoke: all chapter HUDs' refinement.log
      - name: Exercise sprite kit and persistent effects
        run: |
          set -o pipefail
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script tools/sprite_kit_smoke.gd --quit-after 300 2>&1 | tee sprite-kit.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed' sprite-kit.log; then exit 1; fi
          grep -F 'Sprite kit smoke: live slide' sprite-kit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: |
            import.log
            smoke.log
            review.log
            encounter.log
            upper_ridge.log
            house_one.log
            refinement.log
            sprite-kit.log
      - name: Install Linux export templates
        if: success()
        run: |
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j /tmp/templates.tpz templates/linux_release.x86_64 templates/linux_debug.x86_64 -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Export Linux x86_64
        run: |
          set -o pipefail
          mkdir -p build
          engine/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Linux build/pineridge.x86_64 2>&1 | tee export.log
          test -s build/pineridge.x86_64
          chmod +x build/pineridge.x86_64
          build/pineridge.x86_64 --headless --quit-after 90
          tar -czf pineridge-linux-x86_64.tar.gz -C build pineridge.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: pineridge-linux-x86_64
          path: pineridge-linux-x86_64.tar.gz
